<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.3; transform: scaleY(0.9); }
        50% { opacity: 0.8; transform: scaleY(1.1); }
      }
      @keyframes downloadArrow {
        0% { transform: translateY(-12px); opacity: 0; }
        40% { opacity: 1; }
        80% { transform: translateY(12px); opacity: 1; }
        100% { transform: translateY(18px); opacity: 0; }
      }
      @keyframes orbitParticles {
        0% { transform: rotate(0deg) translateX(70px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(70px) rotate(-360deg); }
      }
      @keyframes shimmer {
        0% { stop-color: #38bdf8; }
        50% { stop-color: #f472b6; }
        100% { stop-color: #38bdf8; }
      }
      .floating-cloud {
        animation: floatSlow 5s ease-in-out infinite;
        transform-origin: center;
      }
      .arrow-anim {
        animation: downloadArrow 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: center;
      }
      .particle-1 {
        animation: orbitParticles 8s linear infinite;
        transform-origin: 200px 200px;
      }
      .particle-2 {
        animation: orbitParticles 12s linear infinite reverse;
        transform-origin: 200px 200px;
      }
      .grid-line {
        stroke: #334155;
        stroke-opacity: 0.15;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-gradient)" />
  
  <!-- Subtle Grid Pattern -->
  <g class="grid-line" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="200" cy="200" r="140" fill="#38bdf8" opacity="0.08" filter="url(#soft-glow)" />
  <circle cx="950" cy="180" r="160" fill="#818cf8" opacity="0.07" filter="url(#soft-glow)" />

  <!-- Left Side: Interactive Dynamic iCloud Animated Graphic -->
  <g id="cloud-animation-group" transform="translate(40, 0)">
    <!-- Orbiting particle dots -->
    <circle class="particle-1" cx="200" cy="200" r="4" fill="#38bdf8" filter="url(#glow)" />
    <circle class="particle-2" cx="200" cy="200" r="3" fill="#c084fc" filter="url(#glow)" />
    
    <!-- Outer boundary glow ring -->
    <circle cx="200" cy="200" r="85" fill="none" stroke="url(#primary-grad)" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4" />

    <!-- Animated Cloud Container -->
    <g class="floating-cloud">
      <!-- Outer Cloud Shadow / Glow -->
      <path d="M 160 210 A 32 32 0 0 1 180 155 A 48 48 0 0 1 250 155 A 36 36 0 0 1 270 210 Z" 
            fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" opacity="0.8"/>

      <!-- Main Cloud Body -->
      <path d="M 145 220 A 30 30 0 0 1 165 165 A 46 46 0 0 1 235 162 A 35 35 0 0 1 255 220 Z" 
            fill="url(#cloud-grad)" />

      <!-- Downward Arrow with dynamic looping animation -->
      <g class="arrow-anim" transform="translate(200, 195)">
        <line x1="0" y1="-16" x2="0" y2="12" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" />
        <polyline points="-9,4 0,14 9,4" fill="none" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Storage Tray / Base Line -->
    <path d="M 135 245 L 265 245" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M 135 240 L 135 245 L 145 245" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M 265 240 L 265 245 L 255 245" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Right Side: Clean Typography & Feature Badges -->
  <g transform="translate(380, 0)">
    <!-- Category Mini-Tag -->
    <rect x="0" y="72" width="165" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="82" y="89" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">PYTHON CLI TOOL</text>

    <!-- Main Title -->
    <text x="0" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
      iCloud <tspan fill="url(#primary-grad)">Downloader</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="194" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
      Automated, fast &amp; secure backup for Apple Photos &amp; Albums
    </text>

    <!-- Visual Feature Badges / Highlights -->
    <g transform="translate(0, 235)">
      <!-- Badge 1: 2FA Authentication -->
      <g transform="translate(0, 0)">
        <rect width="155" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#10b981" />
        <text x="35" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">2FA Supported</text>
      </g>

      <!-- Badge 2: All Albums Hierarchy -->
      <g transform="translate(170, 0)">
        <rect width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#38bdf8" />
        <text x="35" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Album Hierarchy</text>
      </g>

      <!-- Badge 3: Cross Platform -->
      <g transform="translate(355, 0)">
        <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#c084fc" />
        <text x="35" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Mac · Linux · Win · NAS</text>
      </g>

      <!-- Badge 4: 100% Free & Open Source -->
      <g transform="translate(550, 0)">
        <rect width="165" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#f59e0b" />
        <text x="35" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Free &amp; Open Source</text>
      </g>
    </g>
  </g>

  <!-- Modern Accent Border -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="url(#primary-grad)" stroke-width="1.5" opacity="0.4" />
</svg>